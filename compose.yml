services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - models:/app/server/.models
      - server_logs:/app/server/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_URL: http://server:8000
    volumes:
      - bot_logs:/app/bot/logs
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  server_logs:
  bot_logs:
